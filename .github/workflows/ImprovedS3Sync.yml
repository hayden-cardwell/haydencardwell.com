name: Upload Website - Improved 

on:
  push:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: website-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AWS
    steps:
    - uses: actions/checkout@master
    - run: python3 -m pip install pypdf
    - name: Check public resume privacy
      run: python3 scripts/check_public_resume.py
    - run: python3 build.py
    - run: >
        aws s3 sync ./public/ s3://${{ secrets.AWS_S3_BUCKET }}/ --acl public-read --follow-symlinks --delete
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-1'
    - name: Avoid caching the public resume
      run: >
        aws s3 cp ./public/docs/hayden-cardwell-resume.pdf s3://${{ secrets.AWS_S3_BUCKET }}/docs/hayden-cardwell-resume.pdf
        --acl public-read --content-type application/pdf --cache-control no-store
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-1'
    - name: Refresh CloudFront and wait until the site is current
      timeout-minutes: 12
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-1'
        CLOUDFRONT_DISTRIBUTION_ID: E3W4QWZSEG1C6F
      run: |
        set -euo pipefail
        invalidation_id=$(aws cloudfront create-invalidation \
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
          --paths '/*' --query 'Invalidation.Id' --output text)
        echo "Waiting for CloudFront invalidation $invalidation_id"
        aws cloudfront wait invalidation-completed \
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
          --id "$invalidation_id"
        echo "CloudFront cache refresh completed." >> "$GITHUB_STEP_SUMMARY"
