    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        background-color: var(--bg);
        color: var(--color);
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .container {
        border: 2px solid var(--color);
        padding: 40px;
        box-shadow: 0 0 20px var(--color);
      }
      h1 {
        font-size: 2.5em;
        text-transform: uppercase;
        margin-bottom: 20px;
        letter-spacing: 3px;
        color: var(--c3);
      }
      p {
        font-size: 1.2em;
        margin-bottom: 30px;
        color: var(--c4);
      }
      input[type="text"] {
        background-color: #111;
        border: 1px solid var(--color);
        color: var(--color);
        padding: 10px;
        font-size: 1em;
        margin-right: 10px;
      }
      button {
        background-color: var(--color);
        border: none;
        color: #000;
        padding: 10px 20px;
        font-size: 1em;
        cursor: pointer;
        text-transform: uppercase;
      }
      #message {
        margin-top: 20px;
        color: #f00;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 id="status-text">ACCESSING SECURE PORTFOLIO...</h1>
      <p id="subtitle"></p>
    </div>

    <script>
      const statusText = document.getElementById('status-text');
      const subtitle = document.getElementById('subtitle');
      const sequence = [
        { text: 'BYPASSING FIREWALL...', delay: 500 },
        { text: 'AUTHENTICATION SUCCESSFUL...', delay: 500 },
        { text: 'ACCESS GRANTED', delay: 500, final: true }
      ];

      let i = 0;
      function runSequence() {
        if (i < sequence.length) {
          statusText.textContent = sequence[i].text;
          if (sequence[i].final) {
            statusText.style.color = 'var(--color)'; // Green for success
            subtitle.textContent = 'Redirecting to terminal...';
            setTimeout(() => {
              window.location.href = 'terminal.html';
            }, 1500);
          }
          i++;
          if (!sequence[i-1].final) {
            setTimeout(runSequence, sequence[i-1].delay);
          }
        }
      }
      
      setTimeout(runSequence, 1000);
    </script>
  </body>
</html>
